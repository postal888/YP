<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #player-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    id="player-frame"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>
  <script>
    var iframe = document.getElementById('player-frame');
    var progressTimer = null;
    var progressIntervalMs = {{PROGRESS_INTERVAL_MS}};
    var youtubeOrigin = 'https://www.youtube.com';
    var currentConfig = null;
    var listening = false;

    function post(event, payload) {
      var message = Object.assign({ event: event }, payload || {});
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.youtube) {
        window.webkit.messageHandlers.youtube.postMessage(message);
      }
    }

    function clearProgressTimer() {
      if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
      }
    }

    function startProgressTimer() {
      clearProgressTimer();
      progressTimer = setInterval(function () {
        sendCommand('getCurrentTime');
        sendCommand('getDuration');
      }, progressIntervalMs);
    }

    function youtubeErrorMessage(code) {
      switch (code) {
        case 2: return 'Invalid parameter (code 2)';
        case 5: return 'HTML5 player error (code 5)';
        case 100: return 'Video not found or private (code 100)';
        case 101: return 'Embedding disabled by owner (code 101)';
        case 150: return 'Embedding disabled by owner (code 150)';
        case 152: return 'Playback blocked: invalid referer/origin (code 152)';
        case 153: return 'Missing HTTP Referer header (code 153)';
        default: return 'YouTube error code ' + code;
      }
    }

    function buildEmbedUrl(config) {
      var params = new URLSearchParams({
        playsinline: config.playsInline ? '1' : '0',
        rel: '0',
        modestbranding: '1',
        enablejsapi: '1',
        origin: youtubeOrigin,
        widget_referrer: youtubeOrigin,
        controls: config.showControls ? '1' : '0',
        fs: config.allowFullscreen ? '1' : '0',
        autoplay: config.autoplay ? '1' : '0'
      });

      if (config.startTime > 0) {
        params.set('start', String(Math.floor(config.startTime)));
      }

      return youtubeOrigin + '/embed/' + encodeURIComponent(config.videoId) + '?' + params.toString();
    }

    function sendCommand(func, args) {
      if (!iframe || !iframe.contentWindow) return;
      iframe.contentWindow.postMessage(JSON.stringify({
        event: 'command',
        func: func,
        args: args || ''
      }), '*');
    }

    function beginListening() {
      if (!iframe || !iframe.contentWindow || listening) return;
      listening = true;
      iframe.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1 }), '*');
      post('ready');
      startProgressTimer();
      if (currentConfig && currentConfig.autoplay) {
        sendCommand('playVideo');
      }
    }

    function onWindowMessage(event) {
      if (!event || (event.origin !== youtubeOrigin && event.origin !== 'https://www.youtube-nocookie.com')) {
        return;
      }

      var data = event.data;
      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (e) {
          return;
        }
      }

      if (!data || !data.event) return;

      if (data.event === 'onReady' || data.event === 'ready') {
        beginListening();
        return;
      }

      if (data.event === 'onStateChange' && typeof data.info === 'number') {
        post('state', { data: data.info });
        if (data.info === 0) {
          post('ended');
        }
        return;
      }

      if (data.event === 'infoDelivery' && data.info) {
        var currentTime = typeof data.info.currentTime === 'number' ? data.info.currentTime : 0;
        var duration = typeof data.info.duration === 'number' ? data.info.duration : 0;
        post('progress', { currentTime: currentTime, duration: duration });
        return;
      }

      if (data.event === 'onError' && typeof data.info === 'number') {
        post('error', {
          message: youtubeErrorMessage(data.info),
          code: data.info
        });
      }
    }

    window.addEventListener('message', onWindowMessage);

    iframe.addEventListener('load', function () {
      listening = false;
      window.setTimeout(beginListening, 300);
    });

    function createPlayer(config) {
      currentConfig = config;
      listening = false;
      clearProgressTimer();
      iframe.src = buildEmbedUrl(config);
    }

    window.youtubeBridge = {
      createPlayer: createPlayer,
      play: function () {
        sendCommand('playVideo');
      },
      pause: function () {
        sendCommand('pauseVideo');
      },
      seekTo: function (seconds) {
        sendCommand('seekTo', [seconds, true]);
      },
      loadVideo: function (videoId, startTime) {
        createPlayer({
          videoId: videoId,
          autoplay: false,
          startTime: startTime || 0,
          showControls: currentConfig ? currentConfig.showControls : true,
          allowFullscreen: currentConfig ? currentConfig.allowFullscreen : true,
          playsInline: currentConfig ? currentConfig.playsInline : true
        });
      }
    };
  </script>
</body>
</html>
